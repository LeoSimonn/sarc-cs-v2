# Porta/host
server.address=0.0.0.0
server.port=8080

# Datasource (deixe a URL/credenciais vindo do docker-compose)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
# Dialeto é opcional no Boot 3; pode deixar sem. Se quiser forçar:
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desligar H2 console (se existia)
spring.h2.console.enabled=false

# Inicialização de scripts (se tiver schema.sql/data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
